apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-book-app-deploy
  namespace: unicorn
  labels:
    app: book
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: book                     
    spec:
      serviceAccountName: db
      nodeSelector:
        unicorn: app
      containers:
        - name: book                  
          image: 003150130236.dkr.ecr.ap-northeast-2.amazonaws.com/unicorn-concert-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom: 
            - configMapRef: 
                name: unicorn-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi